<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLC 데이터 수집기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='5' fill='%232dbe6e'/%3E%3Cpath d='M5 17h5V9h6v8h5' fill='none' stroke='%2306210f' stroke-width='2.2' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<script>
  try {
    var t = localStorage.getItem('theme');
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
</head>
<body>
<header class="rail">
  <a class="brand" href="#/">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="5" fill="#2dbe6e"/><path d="M5 17h5V9h6v8h5" fill="none" stroke="#06210f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>PLC 데이터 수집기</span>
  </a>
  <nav id="nav" aria-label="주 메뉴"></nav>
  <div class="rail-end">
    <div id="runpill" class="pill" role="status" aria-live="polite"><span class="dot"></span><span id="runtext">연결 중…</span></div>
    <button id="runbtn" type="button" class="btn go">수집 시작</button>
    <button id="themebtn" type="button" class="btn plain" aria-label="화면 색상 바꾸기"></button>
  </div>
</header>
<main id="main"></main>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="/ui.js"></script>
<script src="/pages1.js"></script>
<script src="/pages2.js"></script>
<script src="/main.js"></script>
</body>
</html>
